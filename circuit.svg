   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview7"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="mm"
     showgrid="false"
     inkscape:zoom="0.76791526"
     inkscape:cx="365.92579"
     inkscape:cy="561.25984"
     inkscape:window-width="1434"
     inkscape:window-height="748"
     inkscape:window-x="529"
     inkscape:window-y="381"
     inkscape:window-maximized="0"
     inkscape:current-layer="layer1" />
  <defs
     id="defs2">
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2430" />
    </marker>
  </defs>
  <g
     inkscape:label="Layer 1"
     inkscape:groupmode="layer"
     id="layer1"
     style="font-family:sans-serif">

    <!-- Title -->
    <text x="105" y="16" text-anchor="middle" font-size="6" font-weight="bold" fill="#1b2430">ESP32 Alarm — Battery Power Wiring</text>
    <text x="105" y="22" text-anchor="middle" font-size="3.2" fill="#66707c">TP4056 charger + TPS63020 buck-boost, switch on EN pin only</text>

    <!-- GND common rail -->
    <line x1="25" y1="38" x2="25" y2="228" stroke="#66707c" stroke-width="0.6" />
    <text x="19" y="29" font-size="3.2" fill="#66707c">GND (common return — all stages share this)</text>
    <!-- GND stubs into each block -->
    <line x1="25" y1="57"  x2="65" y2="57"  stroke="#66707c" stroke-width="0.5" />
    <line x1="25" y1="95"  x2="65" y2="95"  stroke="#66707c" stroke-width="0.5" />
    <line x1="25" y1="145" x2="65" y2="145" stroke="#66707c" stroke-width="0.5" />
    <line x1="25" y1="195" x2="65" y2="195" stroke="#66707c" stroke-width="0.5" />
    <circle cx="25" cy="57"  r="0.8" fill="#66707c" />
    <circle cx="25" cy="95"  r="0.8" fill="#66707c" />
    <circle cx="25" cy="145" r="0.8" fill="#66707c" />
    <circle cx="25" cy="195" r="0.8" fill="#66707c" />

    <!-- Battery -->
    <rect x="65" y="35" width="80" height="22" rx="2" fill="#eef2fb" stroke="#2f6fed" stroke-width="0.6" />
    <text x="105" y="44" text-anchor="middle" font-size="4.3" font-weight="bold" fill="#1b2430">Li-ion Battery</text>
    <text x="105" y="50" text-anchor="middle" font-size="3.4" fill="#66707c">3.7V, 1850mAh</text>
    <text x="140" y="41" text-anchor="end" font-size="3" fill="#66707c">B+</text>
    <text x="70" y="55" text-anchor="start" font-size="3" fill="#66707c">B−</text>

    <!-- Battery -> TP4056 wire -->
    <line x1="105" y1="57" x2="105" y2="68" stroke="#1b2430" stroke-width="0.6" marker-end="url(#arrow)" />
    <text x="108" y="64" font-size="3" fill="#1b2430">B+</text>

    <!-- TP4056 -->
    <rect x="65" y="68" width="80" height="27" rx="2" fill="#eef2fb" stroke="#2f6fed" stroke-width="0.6" />
    <text x="105" y="79" text-anchor="middle" font-size="4.3" font-weight="bold" fill="#1b2430">TP4056</text>
    <text x="105" y="85" text-anchor="middle" font-size="3.2" fill="#66707c">Type-C charger + protection</text>
    <text x="105" y="90.5" text-anchor="middle" font-size="2.8" fill="#66707c">(DW01+8205A protected variant)</text>

    <!-- USB-C charging input into TP4056 -->
    <rect x="158" y="73" width="32" height="17" rx="2" fill="#fff7e6" stroke="#d9a406" stroke-width="0.5" />
    <text x="174" y="80" text-anchor="middle" font-size="3.2" font-weight="bold" fill="#7a5b00">USB-C</text>
    <text x="174" y="85" text-anchor="middle" font-size="2.6" fill="#7a5b00">charging in</text>
    <line x1="158" y1="81.5" x2="145" y2="81.5" stroke="#d9a406" stroke-width="0.6" marker-end="url(#arrow)" />
    <text x="105" y="102" text-anchor="middle" font-size="2.7" fill="#7a5b00">USB-C charges the battery independently of the switch — always active</text>

    <!-- TP4056 OUT+ junction, splits into VCin+ (always on) and EN (switched) -->
    <line x1="105" y1="95" x2="105" y2="105" stroke="#1b2430" stroke-width="0.6" />
    <circle cx="105" cy="105" r="1" fill="#1b2430" />
    <text x="108" y="98" font-size="3" fill="#1b2430">OUT+</text>

    <!-- Left branch: VCin+, always connected, no switch -->
    <line x1="105" y1="105" x2="90" y2="105" stroke="#1b2430" stroke-width="0.6" />
    <line x1="90" y1="105" x2="90" y2="115" stroke="#1b2430" stroke-width="0.6" marker-end="url(#arrow)" />
    <text x="87" y="112" text-anchor="end" font-size="2.8" fill="#1b2430">VCin+</text>
    <text x="87" y="107" text-anchor="end" font-size="2.4" fill="#66707c">(always on)</text>

    <!-- Right branch: EN, through the switch -->
    <line x1="105" y1="105" x2="130" y2="105" stroke="#1b2430" stroke-width="0.6" />
    <line x1="130" y1="105" x2="130" y2="109" stroke="#1b2430" stroke-width="0.6" />
    <!-- switch symbol: two terminal dots + open-contact diagonal -->
    <circle cx="130" cy="109" r="0.9" fill="#1b2430" />
    <circle cx="130" cy="115" r="0.9" fill="#1b2430" />
    <line x1="130" y1="109" x2="134" y2="113.5" stroke="#1b2430" stroke-width="0.6" />
    <text x="137" y="112" font-size="3" fill="#1b2430">on/off switch</text>
    <line x1="130" y1="115" x2="130" y2="115" stroke="#1b2430" stroke-width="0.6" />
    <line x1="130" y1="115" x2="130" y2="119" stroke="#1b2430" stroke-width="0.6" marker-end="url(#arrow)" />
    <text x="133" y="121" text-anchor="start" font-size="2.8" fill="#1b2430">EN</text>
    <text x="133" y="124" text-anchor="start" font-size="2.4" fill="#66707c">(switched)</text>

    <!-- TPS63020 -->
    <rect x="65" y="119" width="80" height="30" rx="2" fill="#eef2fb" stroke="#2f6fed" stroke-width="0.6" />
    <text x="105" y="131" text-anchor="middle" font-size="4.3" font-weight="bold" fill="#1b2430">TPS63020</text>
    <text x="105" y="137" text-anchor="middle" font-size="3.2" fill="#66707c">Buck-boost regulator → 3.3V</text>
    <text x="105" y="142.5" text-anchor="middle" font-size="2.8" fill="#66707c">output only while EN is pulled high</text>

    <!-- TPS63020 -> ESP32 wire -->
    <line x1="105" y1="149" x2="105" y2="165" stroke="#1b2430" stroke-width="0.6" marker-end="url(#arrow)" />
    <text x="108" y="159" font-size="3" fill="#1b2430">3.3V OUT</text>

    <!-- ESP32 -->
    <rect x="65" y="165" width="80" height="30" rx="2" fill="#eef2fb" stroke="#2f6fed" stroke-width="0.6" />
    <text x="105" y="177" text-anchor="middle" font-size="4.3" font-weight="bold" fill="#1b2430">ESP32-WROOM-32</text>
    <text x="105" y="183" text-anchor="middle" font-size="3.2" fill="#66707c">3V3 pin (direct)</text>
    <text x="105" y="188.5" text-anchor="middle" font-size="2.8" fill="#66707c">VIN/5V pin left unused</text>

    <!-- Legend / key point -->
    <rect x="30" y="205" width="150" height="20" rx="2" fill="#f3f5f9" stroke="#66707c" stroke-width="0.4" />
    <text x="105" y="212" text-anchor="middle" font-size="3.2" font-weight="bold" fill="#1b2430">Why the switch sits on EN, not the main line</text>
    <text x="105" y="217.5" text-anchor="middle" font-size="2.8" fill="#66707c">VCin+ stays permanently wired, so the TP4056 keeps charging the battery over</text>
    <text x="105" y="221.5" text-anchor="middle" font-size="2.8" fill="#66707c">USB-C all day even while the switch is off — only the 3.3V output is gated.</text>
  </g>
</svg>
