<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm - Dev Page</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --border: #e2e7ee;
      --text: #1b2430;
      --text-dim: #66707c;
      --accent: #2f6fed;
      --good: #1f8a4c;
      --bad: #c62839;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151b;
        --surface: #1a2029;
        --border: #2a3240;
        --text: #e7ecf2;
        --text-dim: #9aa5b2;
        --accent: #5b9bff;
        --good: #3fcf7a;
        --bad: #ff6b76;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 22px 14px 60px;
    }
    #app {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 1.25rem; text-align: center; margin: 2px 0 0; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card h2 {
      margin: 0 0 10px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }
    .card p { margin: 6px 0; line-height: 1.5; }
    .hint { font-size: 0.82rem; color: var(--text-dim); }
    pre {
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      font-size: 0.8rem;
      margin: 8px 0;
    }
    table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    table td { padding: 7px 4px; border-bottom: 1px solid var(--border); }
    table tr:last-child td { border-bottom: none; }
    table td:first-child { color: var(--text-dim); }
    table td:last-child { text-align: right; }
    table td[colspan] {
      color: var(--text-dim);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-top: 14px;
    }
    table tr:first-child td[colspan] { padding-top: 4px; }
    button {
      font-size: 0.92rem;
      font-weight: 600;
      padding: 10px 16px;
      margin: 4px 6px 4px 0;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.danger { background: var(--bad); border-color: var(--bad); }
    input[type=number], input[type=datetime-local], input[type=time], select {
      font-size: 0.92rem;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 6em;
    }
    input[type=datetime-local], input[type=time] { width: auto; }
    select { width: auto; max-width: 100%; }
    label.checkbox { display: inline-flex; align-items: center; gap: 4px; margin: 4px 10px 4px 0; font-size: 0.92rem; }
    .header-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .header-row h1 { margin: 0; }
    .badge { background: var(--good); color: #fff; font-size: 0.75rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
    .battery { margin-left: auto; font-size: 0.88rem; color: var(--text-dim); }
    .big-clock { font-size: 2.6rem; font-weight: 700; text-align: center; margin: 10px 0 0; letter-spacing: 0.02em; }
    .big-date { text-align: center; color: var(--text-dim); margin: 0 0 4px; }
    .pill { display: inline-block; background: var(--good); color: #fff; font-weight: 700; padding: 2px 10px; border-radius: 6px; font-size: 0.95rem; margin-left: 6px; }
    pre.json-box { background: #0b0f14; color: #8fe3a5; border-color: #0b0f14; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 8px 0; }
    .weekday-label { text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
    button.day-chip {
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      margin: 0;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    button.day-chip.good { background: var(--good); border-color: var(--good); color: #fff; }
    button.day-chip.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
    button.day-chip.today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 10px 2px var(--accent); }
    input.dirty { border-color: #d9a406; background: rgba(217, 164, 6, 0.14); }
  </style>
</head>
<body>
  <div id="app">
    <section class="card">
      <div class="header-row">
        <span v-if="connected" class="badge">Connected</span>
        <h1>ESP32 Alarm</h1>
        <span v-if="connected" class="battery">
          Battery: {{ status.batteryPct !== null && status.batteryPct !== undefined
                      ? status.batteryPct + '%' : 'not installed yet' }}
        </span>
      </div>
      <template v-if="connected">
        <div class="big-clock">{{ status.timeKnown ? formatClock(espNowEpoch) : '--:--:--' }}</div>
        <div class="big-date">{{ status.timeKnown ? formatDate(espNowEpoch) : '(time not set yet)' }}</div>
        <p class="hint" style="text-align:center">epoch (UTC): {{ status.timeKnown ? Math.floor(espNowEpoch) : '?' }}</p>
      </template>
      <template v-else>
        <button @click="connectBle" :disabled="connecting">
          {{ connecting ? 'Connecting...' : 'Connect' }}
        </button>
        <p class="hint">{{ connectionStatus }}</p>
        <p class="hint" v-if="!bleSupported">
          This browser has no Web Bluetooth support -- open this file in
          Chrome on Android. It will not work on iPhone/Safari.
        </p>
      </template>
    </section>

    <template v-if="connected">
      <section class="card">
        <h2>Alarm</h2>
        <template v-if="status.state === 'idle'">
          <p>Set alarm</p>
          <p>
            <input type="time" v-model="alarmTime">
            <span class="hint">({{ alarmIsTomorrow ? 'tomorrow' : 'today' }})</span>
            <button @click="arm">Arm</button>
          </p>
        </template>
        <template v-else>
          <p>Alarm set to <b>{{ formatClock(status.wakeUpTimeEpoch) }}</b>
            <span class="pill">{{ formatCountdown(status.wakeUpTimeEpoch - espNowEpoch) }}</span></p>
          <p>Before set to <b>{{ formatClock(beforeEpoch) }}</b>
            <span class="pill">{{ formatCountdown(beforeEpoch - espNowEpoch) }}</span></p>
          <p v-if="status.state === 'loaded'">
            <button @click="unarm" class="danger">Unarm</button>
          </p>
        </template>
        <p style="margin-top:14px">
          Load test alarm in
          <input type="number" v-model.number="testLoadInSeconds">
          seconds
          <button @click="testLoadAlarm">Load</button>
          <button @click="forceReset" class="danger">Force Reset (dev)</button>
        </p>
        <p class="hint">
          Time was pushed from this phone's clock the moment we connected --
          no WiFi/NTP involved.
        </p>
      </section>

      <section class="card">
        <h2>Alarm state machine json</h2>
        <pre class="json-box">{{ JSON.stringify(status, null, 2) }}</pre>
      </section>

      <section class="card">
        <h2>Calendar</h2>
        <div class="calendar-grid">
          <div class="weekday-label" v-for="wd in WEEKDAY_LABELS" :key="wd">{{ wd }}</div>
          <template v-for="week in calendarWeeks">
            <button v-for="day in week" :key="day.key" @click="cycleRating(day)"
                    :disabled="day.isFuture"
                    :class="['day-chip', historyData[day.key] || 'neutral', { today: day.isToday }]"
                    :title="day.key">
              {{ day.label }}
            </button>
          </template>
        </div>
        <p>
          Required hold time right now: <b>{{ previewHoldMin.toFixed(1) }} min</b>
          <span class="hint">(base {{ (configCfg.tempIntervalSec / 60).toFixed(1) }} min)</span>
        </p>
      </section>

      <section class="card">
        <h2>Config</h2>
        <pre>{{ JSON.stringify({...configCfg, buzzer: undefined}, null, 2) }}</pre>
        <table>
          <tr><td colspan="2">Paces</td></tr>
          <tr><td>bufferDownPace</td><td><input type="number" step="0.1" v-model.number="configCfg.bufferDownPace" :class="{dirty: isDirty('bufferDownPace')}"></td></tr>
          <tr><td>agroUpPace</td><td><input type="number" step="0.1" v-model.number="configCfg.agroUpPace" :class="{dirty: isDirty('agroUpPace')}"></td></tr>
          <tr><td>agroDownPace</td><td><input type="number" step="0.1" v-model.number="configCfg.agroDownPace" :class="{dirty: isDirty('agroDownPace')}"></td></tr>
          <tr><td>bufferUpPace</td><td><input type="number" step="0.1" v-model.number="configCfg.bufferUpPace" :class="{dirty: isDirty('bufferUpPace')}"></td></tr>
          <tr><td colspan="2">Timing</td></tr>
          <tr><td>tempIntervalSec (min)</td><td><input type="number" step="0.1" v-model.number="tempIntervalMin" :class="{dirty: isDirty('tempIntervalSec')}"></td></tr>
          <tr><td>timeBeforeSec (min)</td><td><input type="number" step="0.1" v-model.number="timeBeforeMin" :class="{dirty: isDirty('timeBeforeSec')}"></td></tr>
          <tr><td>winDurationSec</td><td><input type="number" v-model.number="configCfg.winDurationSec" :class="{dirty: isDirty('winDurationSec')}"></td></tr>
        </table>
        <template v-if="configDirty">
          <button @click="saveConfig">Save All</button>
          <button @click="undoConfig" class="danger">Undo Changes</button>
        </template>
        <p class="hint">{{ configStatus }}</p>
      </section>

      <section class="card">
        <h2>RGB LED</h2>
        <select v-model="selectedColorIdx">
          <option v-for="(c, i) in RGB_COLORS" :value="i">{{ c.name }} ({{ c.r }}/{{ c.g }}/{{ c.b }})</option>
        </select>
        <button @click="setRgb">Set Color</button>
        <p class="hint">{{ rgbStatus }}</p>
      </section>

      <section class="card">
        <h2>Bar Array (7 LEDs)</h2>
        <p>
          <label v-for="(v, i) in barState" :key="i" class="checkbox">
            <input type="checkbox" v-model="barState[i]"> {{ i + 1 }}
          </label>
        </p>
        <button @click="setBar">Set Bar</button>
        <p class="hint">{{ barStatus }}</p>
      </section>

      <section class="card">
        <h2>Infrared Bulb</h2>
        <button @click="irCmd('on')">On</button>
        <button @click="irCmd('off')">Off</button>
        <button @click="irCmd('fade')">Fade</button>
        <button @click="irCmd('onOld')">On (old, wrong: 0x82)</button>
        <button @click="irCmd('offOld')">Off (old, wrong: 0x02)</button>
        <button @click="irCmd('fadeOld')">Fade (old, unverified: 0xC8)</button>
        <button @click="irLoopCmd">On (30s loop)</button>
        <p class="hint">{{ irStatus }}</p>
      </section>

      <section class="card">
        <h2>Buzzer Curve</h2>
        <table>
          <tr><td>minFreqHz</td><td><input type="number" v-model.number="configCfg.buzzer.minFreqHz" :class="{dirty: isBuzzerDirty('minFreqHz')}"></td></tr>
          <tr><td>maxFreqHz</td><td><input type="number" v-model.number="configCfg.buzzer.maxFreqHz" :class="{dirty: isBuzzerDirty('maxFreqHz')}"></td></tr>
          <tr><td>minDutyPct</td><td><input type="number" v-model.number="configCfg.buzzer.minDutyPct" :class="{dirty: isBuzzerDirty('minDutyPct')}"></td></tr>
          <tr><td>maxDutyPct</td><td><input type="number" v-model.number="configCfg.buzzer.maxDutyPct" :class="{dirty: isBuzzerDirty('maxDutyPct')}"></td></tr>
          <tr><td>beepDurationMs</td><td><input type="number" v-model.number="configCfg.buzzer.beepDurationMs" :class="{dirty: isBuzzerDirty('beepDurationMs')}"></td></tr>
          <tr><td>beepPeriodSec</td><td><input type="number" step="0.1" v-model.number="configCfg.buzzer.beepPeriodSec" :class="{dirty: isBuzzerDirty('beepPeriodSec')}"></td></tr>
        </table>
        <button @click="beep">Beep (tests maxFreqHz/maxDutyPct above)</button>
        <template v-if="buzzerDirty">
          <button @click="saveBuzzerCfg">Save Buzzer</button>
          <button @click="undoBuzzer" class="danger">Undo Changes</button>
        </template>
        <p class="hint">{{ buzzerStatus }} {{ buzzerCfgStatus }}</p>
      </section>
    </template>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

    const SERVICE_UUID = '7a0a0001-8d64-4b1a-9e0a-1234567890ab';
    const STATUS_UUID  = '7a0a0002-8d64-4b1a-9e0a-1234567890ab';
    const CONFIG_UUID  = '7a0a0003-8d64-4b1a-9e0a-1234567890ab';
    const COMMAND_UUID = '7a0a0004-8d64-4b1a-9e0a-1234567890ab';
    const HISTORY_UUID = '7a0a0005-8d64-4b1a-9e0a-1234567890ab';

    const WEEKDAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    // The non-buzzer Config fields tracked for the dirty-highlight/Save-
    // appears/Undo behavior below.
    const MAIN_CONFIG_KEYS = [
      'bufferDownPace', 'agroUpPace', 'agroDownPace', 'bufferUpPace',
      'tempIntervalSec', 'timeBeforeSec', 'winDurationSec',
    ];

    const RGB_COLORS = [
      { name: 'Black (Off)', r: 0, g: 0, b: 0 },
      { name: 'Very Dark Blue', r: 0, g: 0, b: 50 },
      { name: 'Blue', r: 0, g: 0, b: 100 },
      { name: 'Very Dark Green', r: 0, g: 50, b: 0 },
      { name: 'Dark Cyan', r: 0, g: 50, b: 50 },
      { name: 'Blue-ish Cyan', r: 0, g: 50, b: 100 },
      { name: 'Green', r: 0, g: 100, b: 0 },
      { name: 'Light Green / Spring Green', r: 0, g: 100, b: 50 },
      { name: 'Cyan', r: 0, g: 100, b: 100 },
      { name: 'Very Dark Red', r: 50, g: 0, b: 0 },
      { name: 'Dark Purple / Magenta-ish', r: 50, g: 0, b: 50 },
      { name: 'Purple / Violet', r: 50, g: 0, b: 100 },
      { name: 'Dark Yellow / Olive', r: 50, g: 50, b: 0 },
      { name: 'Gray (Medium)', r: 50, g: 50, b: 50 },
      { name: 'Light Purple / Lavender', r: 50, g: 50, b: 100 },
      { name: 'Yellow-Green', r: 50, g: 100, b: 0 },
      { name: 'Light Green', r: 50, g: 100, b: 50 },
      { name: 'Light Cyan', r: 50, g: 100, b: 100 },
      { name: 'Red', r: 100, g: 0, b: 0 },
      { name: 'Rose / Pinkish Red', r: 100, g: 0, b: 50 },
      { name: 'Magenta', r: 100, g: 0, b: 100 },
      { name: 'Orange', r: 100, g: 50, b: 0 },
      { name: 'Salmon / Coral', r: 100, g: 50, b: 50 },
      { name: 'Hot Pink / Pink', r: 100, g: 50, b: 100 },
      { name: 'Yellow', r: 100, g: 100, b: 0 },
      { name: 'Lime / Yellow-ish', r: 100, g: 100, b: 50 },
      { name: 'White', r: 100, g: 100, b: 100 },
    ];

    function encodeJson(obj) {
      return new TextEncoder().encode(JSON.stringify(obj));
    }
    function decodeJson(dataView) {
      return JSON.parse(new TextDecoder().decode(dataView));
    }

    createApp({
      setup() {
        const bleSupported = 'bluetooth' in navigator;
        const connecting = ref(false);
        const connected = ref(false);
        const connectionStatus = ref(bleSupported ? '' : 'Web Bluetooth not available in this browser.');

        const status = ref({});
        const configCfg = ref({
          bufferDownPace: 1, agroUpPace: 1, agroDownPace: 2, bufferUpPace: 1.5,
          tempIntervalSec: 120, timeBeforeSec: 3600, winDurationSec: 3,
          buzzer: { minFreqHz: 400, maxFreqHz: 2000, minDutyPct: 1, maxDutyPct: 50,
                    beepDurationMs: 150, beepPeriodSec: 2.0 },
        });
        const configStatus = ref('');
        const buzzerCfgStatus = ref('');
        // Snapshot of the last value actually loaded/saved from the device --
        // compared against the live configCfg to know what's unsaved, drive
        // the dirty-field highlight, and give Undo something to revert to.
        const savedConfig = ref(JSON.parse(JSON.stringify(configCfg.value)));
        const testLoadInSeconds = ref(30);
        const alarmTime = ref('');
        const selectedColorIdx = ref(0);
        const rgbStatus = ref('');
        const barState = ref([false, false, false, false, false, false, false]);
        const barStatus = ref('');
        const buzzerStatus = ref('');
        const irStatus = ref('');
        const historyData = ref({}); // "YYYY-MM-DD" -> "good" | "bad", missing = neutral

        let device = null, gattServer = null;
        let statusChar = null, configChar = null, commandChar = null, historyChar = null;

        // Tracks the last (epoch, local-clock-ms) pair we actually received
        // from the ESP32, then interpolates forward every second via
        // tickMs -- gives a smooth live countdown between the ~500ms status
        // notifications instead of a value that only jumps on each one.
        const statusReceivedAt = ref({ epoch: 0, atMs: 0 });
        const tickMs = ref(Date.now());
        let ticker = null;
        onMounted(() => { ticker = setInterval(() => { tickMs.value = Date.now(); }, 1000); });
        onUnmounted(() => clearInterval(ticker));

        const espNowEpoch = computed(() => {
          tickMs.value; // dependency, forces this to recompute every tick
          if (!statusReceivedAt.value.atMs) return 0;
          return statusReceivedAt.value.epoch + (Date.now() - statusReceivedAt.value.atMs) / 1000;
        });
        // tempIntervalSec/timeBeforeSec stay stored (and synced to the
        // device) in seconds -- these just let the Config table read/write
        // them in minutes, which is what a human actually thinks in.
        const tempIntervalMin = computed({
          get: () => Math.round((configCfg.value.tempIntervalSec || 0) / 60 * 100) / 100,
          set: (v) => { configCfg.value.tempIntervalSec = Math.round(v * 60); },
        });
        const timeBeforeMin = computed({
          get: () => Math.round((configCfg.value.timeBeforeSec || 0) / 60 * 100) / 100,
          set: (v) => { configCfg.value.timeBeforeSec = Math.round(v * 60); },
        });

        function isDirty(key) { return configCfg.value[key] !== savedConfig.value[key]; }
        const configDirty = computed(() => MAIN_CONFIG_KEYS.some(isDirty));
        function undoConfig() {
          MAIN_CONFIG_KEYS.forEach((key) => { configCfg.value[key] = savedConfig.value[key]; });
        }

        function isBuzzerDirty(key) { return configCfg.value.buzzer[key] !== savedConfig.value.buzzer[key]; }
        const buzzerDirty = computed(() => Object.keys(configCfg.value.buzzer).some(isBuzzerDirty));
        function undoBuzzer() {
          configCfg.value.buzzer = { ...savedConfig.value.buzzer };
        }

        const beforeEpoch = computed(() => {
          // beforeSec comes from the session, not configCfg.timeBeforeSec --
          // a test-loaded alarm overrides it with a short value so Before
          // is actually reachable within a short test window (see
          // states.test_before_sec on the device).
          return (status.value.wakeUpTimeEpoch || 0) - (status.value.beforeSec || 0);
        });

        function pad(n) { return String(n).padStart(2, '0'); }
        function formatClock(epoch) {
          if (!epoch) return '--:--:--';
          const d = new Date(epoch * 1000);
          return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }
        function formatDate(epoch) {
          if (!epoch) return '';
          const d = new Date(epoch * 1000);
          return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
        }
        // Alarm has no date field -- it always resolves to the next
        // occurrence of the picked HH:MM, i.e. today if that time hasn't
        // passed yet (relative to the ESP32's own clock), else tomorrow.
        function resolveWakeEpoch(hhmm, baseEpoch) {
          const [h, m] = hhmm.split(':').map(Number);
          const base = new Date(baseEpoch * 1000);
          const candidate = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m, 0, 0);
          let epoch = candidate.getTime() / 1000;
          if (epoch <= baseEpoch) epoch += 86400;
          return epoch;
        }
        const alarmIsTomorrow = computed(() => {
          if (!alarmTime.value || !espNowEpoch.value) return false;
          const wakeEpoch = resolveWakeEpoch(alarmTime.value, espNowEpoch.value);
          const now = new Date(espNowEpoch.value * 1000);
          const wake = new Date(wakeEpoch * 1000);
          return wake.getDate() !== now.getDate() || wake.getMonth() !== now.getMonth();
        });
        function formatCountdown(seconds) {
          if (seconds === null || seconds === undefined || isNaN(seconds) || seconds <= 0) return '00:00';
          const totalMin = Math.floor(seconds / 60);
          const h = Math.floor(totalMin / 60);
          const m = totalMin % 60;
          return pad(h) + ':' + pad(m);
        }

        // Calendar -- a real Mon-Sun weekly grid, local-calendar-day keyed
        // the same way the device keys them (see tzutil.date_str), assuming
        // the phone and the device agree on timezone. Shows the current
        // week plus the 2 preceding ones (~20 days); days after today in
        // the current week are disabled placeholders, not clickable.
        function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
        function startOfWeekMonday(d) {
          const monday = new Date(d);
          const shift = (d.getDay() === 0 ? -6 : 1) - d.getDay(); // Sun=0 -> back 6, else back to Mon
          monday.setDate(d.getDate() + shift);
          monday.setHours(0, 0, 0, 0);
          return monday;
        }

        const calendarWeeks = computed(() => {
          const today = new Date();
          const todayKey = dateKey(today);
          const gridStart = startOfWeekMonday(today);
          gridStart.setDate(gridStart.getDate() - 14); // 2 full weeks before this one
          const weeks = [];
          const cursor = new Date(gridStart);
          for (let w = 0; w < 3; w++) {
            const week = [];
            for (let i = 0; i < 7; i++) {
              const key = dateKey(cursor);
              week.push({ key, label: cursor.getDate(), isToday: key === todayKey, isFuture: cursor > today });
              cursor.setDate(cursor.getDate() + 1);
            }
            weeks.push(week);
          }
          return weeks;
        });

        // Live preview of what arming right now would require -- same rule
        // as history.calculated_hold_sec on the device: the most recent 3
        // non-neutral days (today going backward), +50% (compounding) per
        // "bad" day among them.
        const previewHoldMin = computed(() => {
          const baseMin = (configCfg.value.tempIntervalSec || 0) / 60;
          let badCount = 0, checked = 0;
          const d = new Date();
          for (let i = 0; i < 20 && checked < 3; i++) {
            const rating = historyData.value[dateKey(d)];
            if (rating) {
              checked++;
              if (rating === 'bad') badCount++;
            }
            d.setDate(d.getDate() - 1);
          }
          return baseMin * Math.pow(1.5, badCount);
        });

        function cycleRating(day) {
          const current = historyData.value[day.key];
          const next = !current ? 'good' : current === 'good' ? 'bad' : null;
          const updated = { ...historyData.value };
          if (next) updated[day.key] = next;
          else delete updated[day.key];
          historyData.value = updated;
          sendCommand({ cmd: 'rateDay', date: day.key, rating: next });
        }

        function onStatusNotify(event) {
          try {
            const parsed = decodeJson(event.target.value);
            status.value = parsed;
            if (parsed.timeKnown) {
              statusReceivedAt.value = { epoch: parsed.now, atMs: Date.now() };
            }
          } catch (e) {
            // a partial/garbled notification -- next one will correct it
          }
        }

        function onDisconnected() {
          connected.value = false;
          connectionStatus.value = 'Disconnected.';
        }

        async function connectBle() {
          connecting.value = true;
          connectionStatus.value = 'Opening device picker...';
          try {
            device = await navigator.bluetooth.requestDevice({
              filters: [{ services: [SERVICE_UUID] }],
            });
            device.addEventListener('gattserverdisconnected', onDisconnected);
            connectionStatus.value = 'Connecting to GATT server...';
            gattServer = await device.gatt.connect();
            const service = await gattServer.getPrimaryService(SERVICE_UUID);
            statusChar = await service.getCharacteristic(STATUS_UUID);
            configChar = await service.getCharacteristic(CONFIG_UUID);
            commandChar = await service.getCharacteristic(COMMAND_UUID);
            historyChar = await service.getCharacteristic(HISTORY_UUID);

            await statusChar.startNotifications();
            statusChar.addEventListener('characteristicvaluechanged', onStatusNotify);

            const initialStatus = decodeJson(await statusChar.readValue());
            status.value = initialStatus;
            if (initialStatus.timeKnown) {
              statusReceivedAt.value = { epoch: initialStatus.now, atMs: Date.now() };
            }
            const loadedCfg = decodeJson(await configChar.readValue());
            configCfg.value = { ...configCfg.value, ...loadedCfg,
                                 buzzer: { ...configCfg.value.buzzer, ...(loadedCfg.buzzer || {}) } };
            savedConfig.value = JSON.parse(JSON.stringify(configCfg.value));
            historyData.value = decodeJson(await historyChar.readValue());

            connected.value = true;
            connectionStatus.value = 'Connected.';

            // Push this phone's own clock immediately -- this is the BLE
            // path's replacement for NTP, no WiFi/router involved.
            await commandChar.writeValue(encodeJson({ cmd: 'setTime', epoch: Math.floor(Date.now() / 1000) }));

            // Default the alarm picker to 8h from now, in the phone's own
            // local time -- the user can still edit it before arming.
            const defaultWake = new Date(Date.now() + 8 * 3600 * 1000);
            alarmTime.value = pad(defaultWake.getHours()) + ':' + pad(defaultWake.getMinutes());
          } catch (e) {
            connectionStatus.value = 'FAILED: ' + e.message;
          } finally {
            connecting.value = false;
          }
        }

        async function sendCommand(cmd, statusRef) {
          try {
            await commandChar.writeValue(encodeJson(cmd));
            if (statusRef) statusRef.value = 'sent';
          } catch (e) {
            if (statusRef) statusRef.value = 'FAILED: ' + e.message;
          }
        }

        async function arm() {
          if (!alarmTime.value) return;
          const epoch = Math.floor(resolveWakeEpoch(alarmTime.value, espNowEpoch.value));
          await sendCommand({ cmd: 'arm', wakeUpTimeEpoch: epoch }, configStatus);
        }

        async function testLoadAlarm() {
          await sendCommand({ cmd: 'testLoad', inSeconds: testLoadInSeconds.value });
        }

        async function unarm() {
          await sendCommand({ cmd: 'cancel' }, configStatus);
        }

        async function forceReset() {
          await sendCommand({ cmd: 'reset' });
        }

        async function saveConfig() {
          configStatus.value = 'saving...';
          try {
            await configChar.writeValue(encodeJson(configCfg.value));
            // Save All writes the whole configCfg (buzzer included), so it
            // clears both dirty states, not just the main fields'.
            savedConfig.value = JSON.parse(JSON.stringify(configCfg.value));
            configStatus.value = 'saved';
          } catch (e) {
            configStatus.value = 'FAILED: ' + e.message;
          }
        }

        async function saveBuzzerCfg() {
          buzzerCfgStatus.value = 'saving...';
          try {
            await configChar.writeValue(encodeJson({ buzzer: configCfg.value.buzzer }));
            savedConfig.value.buzzer = { ...configCfg.value.buzzer };
            buzzerCfgStatus.value = 'saved';
          } catch (e) {
            buzzerCfgStatus.value = 'FAILED: ' + e.message;
          }
        }

        async function setRgb() {
          const c = RGB_COLORS[selectedColorIdx.value];
          rgbStatus.value = 'sending...';
          await sendCommand({ cmd: 'rgb', r: c.r, g: c.g, b: c.b }, rgbStatus);
        }

        async function setBar() {
          barStatus.value = 'sending...';
          await sendCommand({ cmd: 'bar', states: barState.value }, barStatus);
        }

        async function beep() {
          const b = configCfg.value.buzzer;
          buzzerStatus.value = 'sending...';
          await sendCommand({ cmd: 'beep', freq: b.maxFreqHz, dutyPct: b.maxDutyPct }, buzzerStatus);
        }

        async function irCmd(name) {
          irStatus.value = 'sending...';
          await sendCommand({ cmd: 'ir', name }, irStatus);
        }

        async function irLoopCmd() {
          irStatus.value = 'sending...';
          await sendCommand({ cmd: 'irLoop', name: 'on', durationMs: 30000 }, irStatus);
        }

        return {
          bleSupported, connecting, connected, connectionStatus, connectBle,
          status, configCfg, configStatus, saveConfig,
          testLoadInSeconds, testLoadAlarm, forceReset, alarmTime, alarmIsTomorrow, arm, unarm,
          tempIntervalMin, timeBeforeMin, isDirty, configDirty, undoConfig,
          RGB_COLORS, selectedColorIdx, rgbStatus, setRgb,
          barState, barStatus, setBar,
          buzzerStatus, buzzerCfgStatus, saveBuzzerCfg, beep, isBuzzerDirty, buzzerDirty, undoBuzzer,
          irStatus, irCmd, irLoopCmd,
          espNowEpoch, beforeEpoch, formatClock, formatDate, formatCountdown,
          historyData, calendarWeeks, WEEKDAY_LABELS, previewHoldMin, cycleRating,
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
